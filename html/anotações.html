<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Up Fitness - Anotações</title>
    <link rel="stylesheet" href="../css/anotacoes.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
    <nav class="nav">
        <img src="../img/UP Academy.png" class="logo">

        <ul class="nav-link">
            <li><a href="./alunos.html" class="a">ALUNOS</a></li>
            <li><a href="./frequencia.html" class="a">FREQUÊNCIA</a></li>
            <li><a href="./anotações.html" class="a">ANOTAÇÕES</a></li>
        </ul>

        <li>
            <a href="perfilprof.html">
                <img src="../img/login.png" class="login-icon" id="loginFoto">
            </a>
        </li>
    </nav>
</header>
    <!-- TÍTULO -->
    <div class="titulo">

        <h1>Anotações do Professor</h1>

        <p>
            Registre observações importantes sobre seus alunos.
        </p>

    </div>

    <!-- CONTAINER -->
    <div class="container">

        <div class="card">

            <h2>Nova Anotação</h2>

            <!-- SELECT -->
            <select id="alunoAnotacao">

                <option value="">
                    Selecione um aluno
                </option>

            </select>

            <!-- TEXTAREA -->
            <textarea
            id="textoAnotacao"
            placeholder="Digite a anotação..."></textarea>

            <!-- BOTÃO -->
            <button onclick="salvarAnotacao()">

                Salvar Anotação

            </button>

            <!-- LISTA -->
            <div id="listaAnotacoes"></div>

        </div>

    </div>
<script src="../js/anotacoes.js"></script>

</body>
</html>
