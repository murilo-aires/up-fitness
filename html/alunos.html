<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>
    <link rel="stylesheet" href="../css/alunos.css">
</head>
<body>
    <header class="header">
    <nav class="nav">
        <img src="../img/UP Academy.png" class="logo">

        <ul class="nav-link">
            <li><a href="./alunos.html" class="a">ALUNOS</a></li>
            <li><a href="./frequencia.html" class="a">FREQUÊNCIA</a></li>
            <li><a href="./anotações.html" class="a">ANOTAÇÕES</a></li>

        <li>
            <a href="perfilprof.html">
                <img src="../img/login.png" class="login-icon" id="loginFoto">
            </a>
        </li>
    </nav>
    </header>



    <!-- TÍTULO -->
    <div class="titulo">
        <h1>Área do Professor</h1>
        <p>Gerencie alunos e acompanhe os treinos da academia.</p>
    </div>

    <!-- CONTAINER -->
    <div class="container">

        <!-- ADICIONAR ALUNO -->
        <div class="card">

            <h2>Adicionar Aluno</h2>

            <p>
                Cadastre novos alunos para acompanhamento personalizado.
            </p>

            <form>

                <input type="text" placeholder="Nome do aluno" id="nomeAluno">

                <input type="text" placeholder="Matrícula" id="matriculaAluno">

                <button type="button" onclick="adicionarAluno()">
                    Adicionar Aluno
                </button>

            </form>

        </div>

        <!-- LISTA DE ALUNOS -->
        <div class="card">

            <h2>Alunos Adicionados</h2>

            <p>
                Visualize todos os alunos cadastrados.
            </p>

            <div class="lista-alunos" id="listaAlunos"></div>

        </div>

        <!-- SOLICITAÇÕES -->
        <div class="card">

    <h2>Solicitações de Treino</h2>

    <div id="listaSolicitacoes"></div>

</div>

    </div>
    
<script src="../js/aluno.js"></script>
