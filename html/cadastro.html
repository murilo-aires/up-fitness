<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <header class="header">
        <img src="../img/UP Academy.png" alt="" class="logo">
        <div class="div">
            <h1>Cadastre-se</h1>
            <div class="dados">
                <form action="../php/cadastro.php" method="POST">
                <label>Nome:</label>
                <input type="text" placeholder="Digite seu nome" class="box" name="nome" required><br>
                
                <label>Email:</label>
                <input type="email" placeholder="Digite seu email" class="box" name="email"><br>

                <label>CPF:</label>
                <input type="text" placeholder="Digite seu CPF" class="box" name="cpf"><br>

                <label>Telefone:</label>
                <input type="text" placeholder="Digite seu telefone" class="box" name="telefone"><br>

                <label>Senha:</label>
                <input type="password" placeholder="Digite sua senha" class="box" name="senha"><br><br>

                <button class="botao" type="submit">Cadastrar</button><br><br>
                <a href="login.html" class="link">Já possui conta?</a>
                </form>
        </div>
        </div>
    </header>
</body>
</html>
